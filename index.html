<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rubik's Cube</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/23.1.1/tween.umd.js"></script>
</head><body>
<header class="topbar"><span class="brand-mark">▦</span><span class="brand-name">RUBIK'S CUBE</span><button id="fullscreen-btn" class="icon-btn" aria-label="Toggle fullscreen">⛶</button></header>
<section id="ui-panel" class="glass-panel">
<div class="difficulty-wrap"><label class="label" for="difficulty">DIFFICULTY</label><select id="difficulty"><option value="5">Easy</option><option value="20" selected>Medium</option><option value="50">Hard</option><option value="100">Expert</option></select></div>
<div class="button-group"><button id="shuffle-btn">Shuffle</button><button id="solve-btn">Complete</button><button id="restart-btn">Restart</button><button id="stop-btn">Stop</button></div>
<details class="help"><summary>Controls & help</summary><p><b>Drag empty space:</b> Rotate view</p><p><b>Pinch / scroll:</b> Zoom</p><p><b>Tap a tile:</b> Select it</p><p><b>Tap a highlighted tile:</b> Turn layer</p></details>
</section>
<section id="view-panel" class="glass-panel"><div class="label">QUICK VIEW</div><div class="view-buttons"><button data-view="top">Top</button><button data-view="bottom">Bottom</button><button data-view="front">Front</button><button data-view="back">Back</button><button data-view="left">Left</button><button data-view="right">Right</button></div></section>
<div id="face-label" aria-live="polite"></div><div id="canvas-container"></div><script src="script.js"></script>
<script>document.getElementById('fullscreen-btn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){}});</script>
</body></html>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
